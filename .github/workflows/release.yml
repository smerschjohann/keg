# Release pipeline: pushing a v* tag verifies the commit, builds static Linux
# binaries for amd64/arm64, attests their provenance, publishes a multi-arch
# binary-only container image to GHCR and creates the GitHub release with
# checksums.txt. No third-party publishing action: gh (preinstalled on the
# runner) does the upload, the token comes from GITHUB_TOKEN.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a semver tag (vX.Y.Z)"
            exit 1
          fi
      - name: Check module tidiness
        run: make tidy
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout 5m
      - name: Vet
        run: go vet -tags integration ./...
      - name: Unit tests
        run: make test

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.arch }} release tarball
        run: make release-${{ matrix.arch }} VERSION=${GITHUB_REF_NAME}
      - name: Verify stamped version
        if: matrix.arch == 'amd64'
        run: |
          tar -xzf "dist/keg_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -O keg > /tmp/keg
          chmod +x /tmp/keg
          got="$(/tmp/keg --version)"
          want="keg version ${GITHUB_REF_NAME}"
          if [ "$got" != "$want" ]; then
            echo "::error::unexpected version output: '$got', want '$want'"
            exit 1
          fi
      - name: Attest tarball provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/keg_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keg-linux-${{ matrix.arch }}
          path: dist/keg_${{ github.ref_name }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Unpack per-arch binaries
        run: |
          for arch in amd64 arm64; do
            tar -xzf "dist/keg_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" -O keg > "dist/keg_linux-${arch}"
            chmod +x "dist/keg_linux-${arch}"
          done
      - name: Compute image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${GITHUB_REF_NAME}"
          tags_runtime="${image}:${GITHUB_REF_NAME}-runtime"
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            tags+=$'\n'"${image}:latest"
            tags_runtime+=$'\n'"${image}:latest-runtime"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          { echo "tags<<TAGS"; echo "$tags"; echo "TAGS"; } >> "$GITHUB_OUTPUT"
          { echo "tags_runtime<<TAGS"; echo "$tags_runtime"; echo "TAGS"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push binary-only image
        id: build-binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
      - name: Build and push runtime image
        id: build-runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags_runtime }}
          provenance: mode=max
          sbom: true
      - name: Attest binary-only image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build-binary.outputs.digest }}
          push-to-registry: true
      - name: Attest runtime image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build-runtime.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test images
        run: |
          image="${{ steps.meta.outputs.image }}"
          tag="${GITHUB_REF_NAME}"
          want="keg version ${tag}"
          for ref in "${image}:${tag}" "${image}:${tag}-runtime"; do
            got="$(docker run --rm "${ref}" --version)"
            if [ "$got" != "$want" ]; then
              echo "::error::${ref}: unexpected version output '$got', want '$want'"
              exit 1
            fi
          done
          docker run --rm --entrypoint bwrap "${image}:${tag}-runtime" --version
          docker run --rm --entrypoint unshare "${image}:${tag}-runtime" --version
          docker run --rm --entrypoint nft "${image}:${tag}-runtime" --version

  publish:
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum keg_*.tar.gz > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "${prerelease[@]}" \
              --repo "$REPO"
          fi
