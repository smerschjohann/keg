# examples/agy/local-config.yaml
# Beispiel für eine lokale Benutzer-Konfiguration (~/.config/keg/config.yaml
# oder übergeben via --user-config examples/agy/local-config.yaml).
#
# Ermöglicht maschinenspezifische Pfad- und Runner-Freigaben, ohne das
# Git-Repository anpassen oder maschinenlokale Pfade committen zu müssen.

paths:
  storage_base: "/var/lib/containers/storage/sandbox"
  tmp_base: "/tmp"

# 1. Globale Variablen für Template-Ersetzungen (z. B. Mount-Pfade für agy)
vars:
  gemini_config_dir: "~/.gemini"
  agy_bin_dir: "~/.local/bin"

# 2. Lokale Freigaben pro Repository / Pfad-Muster
repos:
  "*/examples/agy":
    # Lokale Pfad-Überschreibungen für diese Sandbox:
    vars:
      gemini_config_dir: "~/.gemini"
      agy_bin_dir: "~/.local/bin"

    # Optionale Host-Runner-Freigaben für Delegation:
    runner:
      extra_exact:
        - "agy"
      extra_prefixes:
        - "agy -p"
      extra_raw:
        - cmd: agy
          subcommands: ["-p"]
          opts_with_value: ["-p"]
          allow_opt_value_form: true

security:
  landlock: auto
