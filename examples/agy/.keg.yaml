version: "1"

# Default-Variablen für Mount-Pfade (können in local-config.yaml bzw.
# ~/.config/keg/config.yaml überschrieben werden):
vars:
  gemini_config_dir: "~/.gemini"
  agy_bin_dir: "~/.local/bin"

# Mounts für Google Antigravity (agy):
# - gemini_config_dir: Google accounts, credentials, settings, state
# - agy_bin_dir: agy CLI binary executable
mounts:
  - src: "{{ .Vars.gemini_config_dir }}"
    dest: /home/sandbox/.gemini
    mode: rw
  - src: "{{ .Vars.agy_bin_dir }}"
    dest: /home/sandbox/.local/bin
    mode: ro

# Zero-trust network in transparent mode (no HTTP proxy):
# - DNS: resolves googleapis.com & static hosts
# - Endpoints: daily-cloudcode-pa.googleapis.com, oauth2.googleapis.com, *.googleapis.com
network:
  mode: transparent
  dns:
    enabled: true
    hosts:
      lh3.googleusercontent.com: 172.217.113.4
      accounts.google.com: 172.217.113.4
  sni_domains:
    - daily-cloudcode-pa.googleapis.com
    - oauth2.googleapis.com
    - "*.googleapis.com"
    - "*.googleusercontent.com"
    - "*.gstatic.com"
    - accounts.google.com
  tcp_endpoints:
    - host: daily-cloudcode-pa.googleapis.com
      ports: [443]
    - host: oauth2.googleapis.com
      ports: [443]
    - host: www.googleapis.com
      ports: [443]
    - host: lh3.googleusercontent.com
      ports: [443]
    - host: accounts.google.com
      ports: [443]
